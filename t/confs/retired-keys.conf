# A conffile written for Backup Manager 0.5.x, before the configuration keys
# were renamed. Every key here is retired, see BM__RETIRED_CONFKEYS in
# lib/sanitize.sh.
export BM_ARCHIVES_REPOSITORY="./repository"
export BM_USER="backup"
export BM_GROUP="backup"
export BM_MAX_TIME_TO_LIVE="90"
export BM_PURGE_DUPLICATES="true"
export BM_ARCHIVES_PREFIX="myhost"
export BM_BACKUP_METHOD="tarball"
export BM_FILETYPE="tar.gz"
export BM_NAME_FORMAT="long"
export BM_DIRECTORIES_BLACKLIST="/var/tmp"
export BM_DUMP_SYMLINKS="false"
export BM_UPLOAD_MODE="ftp"
export BM_UPLOAD_DIR="/backups"
export BM_UPLOAD_KEY="/root/.ssh/id_rsa"
export BM_UPLOAD_USER="backup"
export BM_UPLOAD_PASSWD="secret"
export BM_FTP_PURGE="true"
export BM_UPLOAD_FTPPURGE="true"
